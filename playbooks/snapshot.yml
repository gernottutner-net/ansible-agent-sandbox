---
# Snapshots of the sandbox VMs, on the VirtualBox host.
#
#   ansible-playbook tutner.agent_sandbox.snapshot --limit sandbox-vm
#   ansible-playbook tutner.agent_sandbox.snapshot --limit sandbox-vm -e snapshot_action=take
#   ansible-playbook tutner.agent_sandbox.snapshot --limit sandbox-vm \
#     -e snapshot_action=take -e snapshot_name=pre-session
#   ansible-playbook tutner.agent_sandbox.snapshot --limit sandbox-vm \
#     -e snapshot_action=restore -e snapshot_name=pre-session
#   ansible-playbook tutner.agent_sandbox.snapshot --limit sandbox-vm \
#     -e snapshot_action=delete -e snapshot_name=pre-session
#
# The cheap way back to a known-good VM after a session you do not trust.
# Retention and the recorded baseline are explained in tasks/snapshot.yml
# of the virtualbox_vm role and in docs/virtualbox.md.

- name: Manage VirtualBox VM snapshots
  hosts: agent_sandbox
  gather_facts: false
  connection: local
  become: false
  vars:
    ansible_become: false
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Run the snapshot action
      ansible.builtin.include_role:
        name: tutner.agent_sandbox.virtualbox_vm
        tasks_from: snapshot.yml

# take and restore stop a running VM and start it again. Return only once
# Ansible can reach it, as provision does, so the next ssh or playbook run
# does not hit a guest that is still booting. VMs that were off, and the
# actions list and delete, are not waited for.
- name: Wait for VMs the snapshot action restarted
  hosts: agent_sandbox
  gather_facts: false
  become: false
  tasks:
    - name: "[{{ inventory_hostname }}] Wait until the guest answers over SSH"
      ansible.builtin.wait_for_connection:
        timeout: "{{ vm_boot_timeout | default(300) }}"
        delay: 5
      when: _snapshot_started_vm | default(false) | bool
