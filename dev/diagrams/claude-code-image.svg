<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 1070" width="1290" height="1070" role="img" aria-label="How Claude Code gets into a session: the inventory pins a Claude Code version and an image tag; the agentbox role renders a root-owned Containerfile, builds it rootless as agent through Squid only when the tag does not exist yet, checks the image, and renders the tag into the launcher, which runs it with --pull=never. Updating means bumping both values; the old tag stays for going back.">
<style>
svg{--bg:#f4f6f9;--fg:#18212c;--mu:#5a6575;--vm:#2f6fae;--pod:#13806f;--box:#6648b8;--egr:#b8650f;--tok:#94750a;--ok:#1f7f45;--no:#c23a2f}
@media (prefers-color-scheme: dark){svg{--bg:#0f141b;--fg:#e3e8ef;--mu:#95a2b4;--vm:#6aa8e0;--pod:#3cc4b3;--box:#a990ec;--egr:#f0a35a;--tok:#e0c048;--ok:#5cc77a;--no:#f07066}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px;fill:var(--fg)}
.bg{fill:var(--bg)}
.ti{font-size:20px;font-weight:700}
.h{font-size:14px;font-weight:650}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
.ms{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px}
.mu{fill:var(--mu);font-size:11px;font-style:italic}
.sub{fill:var(--mu)}
.lab{fill:var(--mu);font-size:10.5px;font-weight:650;letter-spacing:.08em}
.tag{font-size:10.5px;font-weight:650;text-anchor:end}
.small{font-size:10px}
.bold{font-weight:650}
.frame{stroke-width:1.6}
.b-vm{fill:var(--vm);fill-opacity:.05;stroke:var(--vm)}
.b-pod{fill:var(--pod);fill-opacity:.06;stroke:var(--pod)}
.b-box{fill:var(--box);fill-opacity:.07;stroke:var(--box)}
.b-egr{fill:var(--egr);fill-opacity:.07;stroke:var(--egr)}
.b-mu{fill:var(--mu);fill-opacity:.05;stroke:var(--mu)}
.b-ok{fill:var(--ok);fill-opacity:.07;stroke:var(--ok)}
.c-vm{fill:var(--vm)}.c-pod{fill:var(--pod)}.c-box{fill:var(--box)}.c-egr{fill:var(--egr)}.c-ok{fill:var(--ok)}.c-no{fill:var(--no)}.c-mu{fill:var(--mu)}
.l-ok{fill:none;stroke:var(--ok);stroke-width:2.2}
.l-mu{fill:none;stroke:var(--mu);stroke-width:1.4}
.l-box{fill:none;stroke:var(--box);stroke-width:1.8}
.sep{stroke:var(--box);stroke-opacity:.35;stroke-width:1}
.chip{fill:var(--bg)}
</style>
<defs>
  <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="c-ok"/></marker>
  <marker id="ah-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="c-mu"/></marker>
  <marker id="ah-box" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="c-box"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1290" height="1070"/>

<text class="ti" x="20" y="38">How Claude Code gets into a session</text>
<text class="sub" x="20" y="58">tutner.agent_sandbox: installed when the image is built, pinned, never updated in place</text>

<!-- Controller -->
<g data-part="controller">
  <rect class="frame b-mu" x="20" y="130" width="205" height="200" rx="8"/>
  <text class="h" x="36" y="152">Controller</text>
  <text class="sub" x="36" y="170">the inventory pins both</text>
  <text class="ms" x="36" y="196">sandbox_image_tag:</text>
  <text class="ms c-box" x="36" y="211">  "0.2.0"</text>
  <text class="ms" x="36" y="231">agentbox_claude_code_version:</text>
  <text class="ms c-box" x="36" y="246">  "2.1.284"</text>
  <text class="mu" x="36" y="266">bumped together</text>
  <text class="ms" x="36" y="296">playbook sandbox</text>
  <text class="ms" x="36" y="311">--tags agentbox</text>
</g>

<!-- VM -->
<rect class="frame b-vm" x="245" y="90" width="805" height="770" rx="9"/>
<text class="h" x="261" y="112">Debian 13 VM</text>
<text class="tag c-vm" x="1036" y="112">builds and runs as agent; the recipe belongs to root</text>
<line class="l-mu" x1="225" y1="210" x2="262" y2="210" marker-end="url(#ah-mu)"/>

<!-- /etc/agentbox -->
<g data-part="recipe">
  <rect class="frame b-box" x="265" y="130" width="240" height="160" rx="7"/>
  <text class="h" x="281" y="152">/etc/agentbox/</text>
  <text class="tag c-box" x="491" y="152">agentbox</text>
  <text class="sub" x="281" y="170">owned by root, rendered by the role</text>
  <text class="m" x="281" y="194">Containerfile</text>
  <text class="m" x="281" y="212">git-credential-agentbox</text>
  <text class="sub" x="281" y="236">build hash: SHA-256 of both</text>
  <text class="mu" x="281" y="270">agent builds from it, cannot change it</text>
</g>
<line class="l-mu" x1="505" y1="210" x2="533" y2="210" marker-end="url(#ah-mu)"/>

<!-- decision -->
<g data-part="decision">
  <rect class="frame b-box" x="535" y="130" width="210" height="160" rx="7"/>
  <text class="h" x="551" y="152">Build or not?</text>
  <text class="sub" x="551" y="170">is the tag in agent's storage?</text>
  <text class="m" x="551" y="196">no</text>
  <text class="m c-ok bold" x="729" y="196" text-anchor="end">build it</text>
  <line class="sep" x1="551" y1="204" x2="729" y2="204"/>
  <text class="m" x="551" y="220">yes, same hash</text>
  <text class="m" x="729" y="220" text-anchor="end">keep</text>
  <line class="sep" x1="551" y1="228" x2="729" y2="228"/>
  <text class="m" x="551" y="244">yes, other hash</text>
  <text class="m c-no bold" x="729" y="244" text-anchor="end">fail</text>
  <text class="mu" x="551" y="270">a tag names exactly one build</text>
</g>
<line class="l-box" x1="640" y1="290" x2="640" y2="327" marker-end="url(#ah-box)"/>
<text class="sub small" x="648" y="313">no: build</text>

<!-- build -->
<g data-part="build">
  <rect class="frame b-box" x="265" y="330" width="480" height="235" rx="7"/>
  <text class="h" x="281" y="352">podman build, rootless, as agent</text>
  <text class="tag c-box" x="729" y="352">agentbox</text>
  <text class="sub" x="281" y="369">tagged localhost/agentbox:0.2.0, labelled with the build hash</text>
  <text class="m" x="281" y="394">FROM debian:trixie-slim</text>
  <text class="ms c-egr" x="729" y="394" text-anchor="end">docker.io</text>
  <text class="m" x="281" y="416">apt-get install git ripgrep bubblewrap socat …</text>
  <text class="ms c-egr" x="729" y="416" text-anchor="end">.debian.org</text>
  <text class="m" x="281" y="438">NodeSource key (.asc), nodejs 22</text>
  <text class="ms c-egr" x="729" y="438" text-anchor="end">deb.nodesource.com</text>
  <text class="m c-box bold" x="281" y="460">npm install -g @anthropic-ai/claude-code@2.1.284</text>
  <text class="ms c-egr" x="729" y="460" text-anchor="end">.npmjs.org</text>
  <text class="m c-box bold" x="281" y="482">ENV DISABLE_AUTOUPDATER=1</text>
  <text class="m" x="281" y="504">user dev 1000:1000, git credential helper</text>
  <text class="m" x="281" y="526">USER dev · WORKDIR /work · CMD ["claude"]</text>
  <text class="mu" x="281" y="551">Claude Code installed as root under /usr: dev cannot change it</text>
</g>
<line class="l-ok" x1="745" y1="445" x2="772" y2="445" marker-end="url(#ah-ok)"/>

<!-- Squid -->
<g data-part="squid">
  <rect class="frame b-egr" x="775" y="330" width="255" height="235" rx="7"/>
  <text class="h" x="791" y="352">Squid</text>
  <text class="tag c-egr" x="1016" y="352">egress_proxy</text>
  <text class="sub" x="791" y="370">every build step goes through it</text>
  <text class="sub" x="791" y="394">the proxy comes from containers.conf</text>
  <text class="sub" x="791" y="411">and is not baked into the image</text>
  <text class="sub" x="791" y="435">so build sources must be on</text>
  <text class="sub" x="791" y="452">egress_allowlist, even those a</text>
  <text class="sub" x="791" y="469">session never uses</text>
  <text class="mu" x="791" y="551">the build runs as agent, like a session</text>
</g>
<line class="l-ok" x1="1030" y1="445" x2="1087" y2="445" marker-end="url(#ah-ok)"/>

<!-- Internet -->
<g data-part="internet">
  <rect class="frame b-ok" x="1090" y="330" width="180" height="235" rx="7"/>
  <text class="h" x="1106" y="352">Internet</text>
  <text class="sub" x="1106" y="370">build-time sources</text>
  <text class="m" x="1106" y="394">registry-1.docker.io</text>
  <text class="m" x="1106" y="416">deb.debian.org</text>
  <text class="m" x="1106" y="438">deb.nodesource.com</text>
  <text class="m" x="1106" y="460">registry.npmjs.org</text>
  <text class="mu" x="1106" y="551">all on the allowlist</text>
</g>

<line class="l-box" x1="505" y1="565" x2="505" y2="602" marker-end="url(#ah-box)"/>
<text class="sub small" x="513" y="588">tag</text>

<!-- storage -->
<g data-part="storage">
  <rect class="frame b-pod" x="265" y="605" width="480" height="120" rx="7"/>
  <text class="h" x="281" y="627">agent's image storage</text>
  <text class="tag c-pod" x="729" y="627">podman</text>
  <rect class="frame b-box" x="281" y="640" width="448" height="30" rx="5"/>
  <text class="m bold" x="293" y="660">localhost/agentbox:0.2.0</text>
  <text class="sub small" x="717" y="659" text-anchor="end">Claude Code 2.1.284 · current</text>
  <rect class="frame b-mu" x="281" y="680" width="448" height="30" rx="5"/>
  <text class="m sub" x="293" y="700">localhost/agentbox:0.1.0</text>
  <text class="sub small" x="717" y="699" text-anchor="end">older build, kept for going back</text>
</g>
<line class="l-mu" x1="745" y1="665" x2="772" y2="665" marker-end="url(#ah-mu)"/>

<!-- check -->
<g data-part="check">
  <rect class="frame b-box" x="775" y="605" width="255" height="120" rx="7"/>
  <text class="h" x="791" y="627">Checked once, by the role</text>
  <text class="m" x="791" y="649">User = dev, uid 1000</text>
  <text class="m" x="791" y="666">no *_proxy in Env</text>
  <text class="m" x="791" y="683">claude --version = 2.1.284</text>
  <text class="m" x="791" y="700">credential helper = agentbox</text>
  <text class="mu" x="791" y="717">a wrong image fails the run</text>
</g>

<line class="l-box" x1="385" y1="725" x2="385" y2="762" marker-end="url(#ah-box)"/>
<text class="sub small" x="393" y="748">by tag, never pulled</text>

<!-- launcher -->
<g data-part="launcher">
  <rect class="frame b-box" x="265" y="765" width="240" height="80" rx="7"/>
  <text class="h" x="281" y="787">/usr/local/bin/agentbox</text>
  <text class="sub" x="281" y="805">the tag is rendered into it</text>
  <text class="m" x="281" y="825">--pull=never</text>
</g>
<line class="l-box" x1="505" y1="805" x2="532" y2="805" marker-end="url(#ah-box)"/>

<!-- session -->
<g data-part="session">
  <rect class="frame b-box" x="535" y="765" width="495" height="80" rx="7"/>
  <text class="h" x="551" y="787">Session container</text>
  <text class="tag c-box" x="1016" y="787">--rm, one per session</text>
  <text class="sub" x="551" y="805">runs claude from the image; user dev cannot update it</text>
  <text class="m c-box" x="551" y="825">DISABLE_AUTOUPDATER=1</text>
  <text class="sub" x="1016" y="825" text-anchor="end">the login in /home/dev/.claude outlives updates</text>
</g>

<!-- Updating -->
<text class="h" x="20" y="902">Updating Claude Code</text>
<text class="sub" x="190" y="902">four steps, and the old image stays</text>
<g data-part="update">
  <rect class="frame b-mu" x="20" y="918" width="290" height="92" rx="7"/>
  <text class="h" x="36" y="940">1 · Bump both values</text>
  <text class="ms" x="36" y="960">agentbox_claude_code_version: "2.x.y"</text>
  <text class="ms" x="36" y="976">sandbox_image_tag: "0.3.0"</text>
  <text class="mu" x="36" y="996">a new tag, never a reused one</text>
  <rect class="frame b-mu" x="340" y="918" width="290" height="92" rx="7"/>
  <text class="h" x="356" y="940">2 · Run the role</text>
  <text class="ms" x="356" y="960">playbook sandbox --tags agentbox</text>
  <text class="sub" x="356" y="978">0.3.0 is not in storage: build it</text>
  <text class="sub" x="356" y="995">and check the new version</text>
  <rect class="frame b-mu" x="660" y="918" width="290" height="92" rx="7"/>
  <text class="h" x="676" y="940">3 · Launcher names 0.3.0</text>
  <text class="sub" x="676" y="960">re-rendered with the new tag</text>
  <text class="sub" x="676" y="977">0.2.0 stays in storage</text>
  <text class="sub" x="676" y="994">a running session keeps its image</text>
  <rect class="frame b-mu" x="980" y="918" width="290" height="92" rx="7"/>
  <text class="h" x="996" y="940">4 · Next session runs it</text>
  <text class="sub" x="996" y="960">the same login and transcripts</text>
  <text class="sub" x="996" y="977">nothing in /work changes</text>
  <line class="l-mu" x1="310" y1="964" x2="337" y2="964" marker-end="url(#ah-mu)"/>
  <line class="l-mu" x1="630" y1="964" x2="657" y2="964" marker-end="url(#ah-mu)"/>
  <line class="l-mu" x1="950" y1="964" x2="977" y2="964" marker-end="url(#ah-mu)"/>
</g>
<text class="sub bold" x="20" y="1036">Going back:</text>
<text class="sub" x="100" y="1036">Set both values back. The tag exists with a matching hash, so nothing is built and the launcher names it again.</text>
<text class="sub bold" x="20" y="1056">Forgot the tag?</text>
<text class="sub" x="124" y="1056">The recipe hash no longer matches the existing tag, and the role fails instead of rebuilding it.</text>
</svg>
