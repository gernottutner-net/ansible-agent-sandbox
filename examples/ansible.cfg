[defaults]
inventory          = inventory.yml
interpreter_python = auto_silent
# A rebuilt VM comes back with new host keys on the same address. Acceptable
# on a host-only network that only this machine can reach.
host_key_checking  = False

[ssh_connection]
# Offer only the key named in host_vars, never every key an ssh-agent holds.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes

# Lets Ansible become the unprivileged sandbox user without the acl package
# on the VM.
pipelining = True
