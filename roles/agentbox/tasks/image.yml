---
# Builds one image as the sandbox user, unless its tag exists already; an
# existing tag must have been built from the same recipe. Shared by the
# session image (main.yml) and the editor image (editor.yml).
#
#   _image:       localhost/<name>:<tag>
#   _image_sha:   sha256 of everything the build is made from, as a label
#   _image_file:  the Containerfile; its directory is the build context
#   _image_tag_var: the variable that sets the tag, for the error message

- name: Look for the image as the sandbox user ({{ _image }})
  ansible.builtin.command: "podman image inspect {{ _image }}"
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _sandbox_uid }}"
  register: _agentbox_existing
  changed_when: false
  failed_when: false
  check_mode: false

# A tag names one build. Rebuilding it from a different recipe would be
# the silent change the tag exists to prevent, so a changed recipe needs a new
# tag instead. Old tags stay in storage: going back is setting the tag back.
- name: Assert an existing tag was built from this recipe ({{ _image }})
  vars:
    _labels: "{{ (_agentbox_existing.stdout | from_json | first).Labels | default({}, true) }}"
  ansible.builtin.assert:
    that: _labels['agentbox.build-sha256'] | default('') == _image_sha
    fail_msg: >-
      {{ _image }} exists but was built from a different recipe
      ({{ _labels['agentbox.build-sha256'] | default('no label') }}, now
      {{ _image_sha }}). Bump {{ _image_tag_var }} in your inventory rather
      than rebuilding the tag.
    success_msg: "{{ _image }} matches the recipe"
  when: _agentbox_existing.rc == 0

# Pulls the base image if missing; every RUN step goes through Squid.
- name: Build the image as the sandbox user ({{ _image }})
  ansible.builtin.command:
    argv:
      - podman
      - build
      - --pull=missing
      - --label
      - "agentbox.build-sha256={{ _image_sha }}"
      - --tag
      - "{{ _image }}"
      - --file
      - "{{ _image_file }}"
      - "{{ _image_file | dirname }}"
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _sandbox_uid }}"
  when:
    - _agentbox_existing.rc != 0
    - not ansible_check_mode
  changed_when: true          # runs only when the tag is missing
