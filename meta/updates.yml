---
# What an existing install needs to do for each release, read by the
# playbook update_check. Newest first. The prose is in CHANGES.md, under
# "Action needed on an existing install"; this file says the same, for a
# playbook to read. A release adds its entry here (dev/releasing.md).
#
#   version:    the release
#   run:        playbook runs it needs, in order: {playbook, tags?, note?}
#   image:      true when the image recipe changed: the role refuses to
#               rebuild an existing sandbox_image_tag, so the inventory
#               needs a new tag, and default_tag is the role's new default
#   variables:  new variables, with what they do; set in the inventory only
#               to change the role default
#   scripts:    controller scripts from examples/ that are new or changed
#   note:       anything else, in one or two sentences
releases:
  - version: "0.7.0"
    run:
      - playbook: sandbox
        tags: [agentbox]
        note: >-
          installs the launcher with the editor and the new option parsing;
          with agentbox_editor_accept_server_license true, also the editor
    image: false
    variables:
      - name: agentbox_editor_accept_server_license
        about: accepts Microsoft's VS Code Server licence and installs the editor; off by default
      - name: agentbox_editor
        about: whether a session on a terminal starts an editor unless told otherwise
      - name: agentbox_editor_vscode_version
        about: the pinned VS Code Server build, with _commit and _sha256
      - name: agentbox_editor_vscode_commit
        about: the commit of that build
      - name: agentbox_editor_vscode_sha256
        about: its SHA-256, from Microsoft's update API
      - name: agentbox_editor_image_tag
        about: the editor image's tag; a changed recipe needs a new one
      - name: agentbox_editor_memory
        about: the editor container's memory limit
      - name: agentbox_editor_cpus
        about: the editor container's CPU limit
      - name: agentbox_editor_pids_limit
        about: the editor container's process limit
    scripts: [agentbox-remote]
    note: >-
      The editor, VS Code for the browser beside each session, opt-in by the
      licence; agentbox-remote --open-editor opens it from the controller.
      The session image is unchanged, so no new sandbox_image_tag.

  - version: "0.6.0"
    run:
      - playbook: sandbox
        note: changes nothing on the VM but the stamp update_check reads
    image: false
    variables:
      - name: agent_sandbox_bin_dir
        about: where update_check -e install_scripts=true puts the controller scripts
    scripts: []
    note: >-
      New playbook update_check, and the stamp on the VM that it reads.

  - version: "0.5.0"
    run:
      - playbook: sandbox
        tags: [agentbox]
        note: installs tmux and the launcher with --tmux and --list
    image: false
    variables: []
    scripts: [agentbox-remote]
    note: >-
      agentbox-remote starts or attaches a session from the controller.

  - version: "0.4.0"
    run:
      - playbook: sandbox
        tags: [agentbox]
        note: builds the new image beside the old one; new managed settings
    image: true
    default_tag: "0.4.0"
    variables:
      - name: agentbox_peer_links
        about: Agent Intercom links between projects; off without links
      - name: agentbox_peer_budget
        about: messages between two linked projects before a person restarts one
    scripts: []
    note: >-
      Claude Code 2.1.323. Bump sandbox_image_tag and
      agentbox_claude_code_version together, as the example does.

  - version: "0.3.0"
    run:
      - playbook: provision
        note: applies vm_memory_mb and vm_cpus to a VM it finds off
    image: false
    variables: []
    scripts: []

  - version: "0.2.0"
    run:
      - playbook: sandbox
        tags: [agentbox]
    image: true
    default_tag: "0.2.0"
    variables:
      - name: agentbox_git_tokens
        about: per-project repository tokens, for the playbook git_token
    scripts: []

  - version: "0.1.0"
    run:
      - playbook: sandbox
    image: true
    default_tag: "0.1.0"
    variables: []
    scripts: []
